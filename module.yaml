# The manifest for smart-plugs: the Go process in main.go and the browser half
# in ui/. It drives Tasmota plugs over HTTP, as many as you list, one or more per
# printer, adds a Tasmota Plugs page, a printer tab and a dashboard card to the
# app, and logs the print events of the printers the host lets it observe.
#
# `prusa-connect module add` reads it out of the release and writes one
# declaration from it.
#
# The namespace is absent on purpose. The host derives it from the repository
# address the operator installed, so no module can name another module's
# address. For this module that is com.github.aux.ccmpbll.tasmota-plugs.

name: smart-plugs
# The kind the one instance is declared under. It offers the service runtime,
# which is what a module with a process needs.
kind: sink
version: 0.2.0
# The licence this module is released under. The marketplace shows it and
# refuses a release without one. An SPDX identifier is the usual form.
license: MIT
# What a marketplace card prints beside the name: the title a person reads,
# one sentence about this module, and who answers for it. The install copies
# them into the declaration, so `GET /api/v1/resources` carries them for an
# installed module. Write your own sentence here, a title if the name alone reads badly, and your name or
# your team's beside it.
# title: Your module's name
title: Tasmota Plugs
summary: Switches Tasmota smart plugs, one or more per printer, from a Tasmota Plugs page, and follows print events.
codeowner: ccmpbll
# The module wire major the process half speaks.
contract_major: 1
# Where the fragment describing the routes is, inside this repository.
openapi: openapi.json
# The platforms the release ships a binary for, each a GOOS_GOARCH pair. Drop
# the ones you do not build, and add the ones you do.
platforms:
  - linux_amd64
  - linux_arm64
  - darwin_arm64
  - windows_amd64

# Every setting this module reads, each with its type, its default and one
# sentence saying what it controls. The host applies every default, writes the
# `config:` block of the instance over it key by key, and sends the result on
# plugin.configure before the first request arrives. A key not named here is
# refused before the process starts, and nothing in main.go reads an
# environment variable, so this list is where an operator finds every knob.
#
# An operator who wants another line writes:
#
#   resources:
#     sink:
#       smart-plugs:
#         config:
#           plugs: '[{"name": "Core One", "host": "192.168.1.30", "printer": "CZPX1234X009XC12345"}]'
options:
  - key: plugs
    type: string
    default: ""
    summary: 'The plugs, as JSON text: [{"name": "Core One", "host": "192.168.1.30", "printer": "CZPX1234"}, ...]. There is no limit on how many. A name is up to 40 characters, without / ? # or %, and empty names it plug1, plug2 and so on. A host is the plug''s host name or IPv4 address, with no port. A printer is the serial of the printer it powers, or empty for none. The Set up plugs page writes it.'
  - key: price_per_kwh
    type: string
    default: ""
    summary: "What a kilowatt-hour costs, such as 0.14, so the energy a plug used can be shown as money. Empty shows no cost."
  - key: currency
    type: string
    default: "$"
    summary: "What the price is written in, such as $, EUR or kr. One to eight characters."
  - key: auto_off_minutes
    type: string
    default: ""
    summary: "Switch off the plugs of a printer that has been idle this many minutes and has cooled down, 1 to 1440. Empty is off. Only plugs linked to a printer."
  - key: auto_off_cooldown_c
    type: string
    default: "40"
    summary: "How cool the hotend and the bed must be, in degrees Celsius, 20 to 100, before an idle printer is switched off. Empty is 40."
  - key: overheat_nozzle_c
    type: string
    default: ""
    summary: "Switch off a printer's plugs, in any state, when a hotend reads above this, 250 to 500 degrees Celsius. Empty is off. A second layer: set it above any filament you print."
  - key: overheat_bed_c
    type: string
    default: ""
    summary: "Switch off a printer's plugs, in any state, when the bed reads above this, 100 to 200 degrees Celsius. Empty is off. A second layer: set it above any filament you print."

# Every connection this module makes outside Prusa Connect. The plugs are listed
# in the one `plugs` setting, so this one entry covers the host of every plug in
# it, however many there are. The operator reads it before approving the install.
egress:
  - option: plugs
    ports: [80]
    why: "The host of every plug in the plugs setting, a JSON list of name, host and printer: reads its state and energy meter and switches its relay, over Tasmota's HTTP command interface."
    sends: Status 0 (a read-only report of the relay, the energy meter, the Wi-Fi signal and the uptime), Power On and Power Off. Nothing else.

# The memory in MiB the server may budget for the process, children included.
# needs:
#   memory_mib: 256

# Read the print events of every printer, so the module can log when a job
# starts and settles.
permissions:
  - observe

# Ask the host whether the person calling may operate this module
# (operate_resource), and the printer a plug powers (operate), before a plug is
# switched. It only asks: the install grants this module nothing for it.
checks:
  - operate_resource
  - operate

# The browser half: a Tasmota Plugs page in the app's sidebar, a line and a section for
# each printer that has a plug, built by `sh scripts/ui-build.sh`
# into ui/dist. The page lists the plugs and switches each one through this
# module's own routes.
ui:
  # The built bundle's entry, relative to the bundle root.
  entry: ui/index.js
  # The range of @prusa/connect-ui this bundle was built against.
  library: ">=0.1.0 <1.0.0"
  contributes:
    pages:
      - path: smart-plugs
        title: Tasmota Plugs
    # A line on each printer's card in the list, and a tab on its own page, for
    # the printers that have a plug linked to them by serial.
    device_card:
      - id: smart-plugs
        title: Tasmota Plugs
    device_tab:
      - id: smart-plugs
        title: Tasmota Plugs
    # A card a person places on a dashboard: a row per plug with a button to
    # switch it. The one setting narrows it to the plugs of chosen printers.
    cards:
      - id: plugs
        title: Tasmota Plugs
        description: Buttons to turn each Tasmota plug on or off, with what it is drawing.
        size: {w: 4, h: 3}
        least: {w: 3, h: 2}
        settings:
          - key: printers
            kind: printers
            label: Printers
