# The manifest for smart-plugs: the Go process in main.go and the browser half
# in ui/. It drives up to eight Tasmota plugs over HTTP, one or more per
# printer, adds a Tasmota Plugs page, a printer tab and a dashboard card to the
# app, and logs the print events of the printers the host lets it observe.
#
# `prusa-connect module add` reads it out of the release and writes one
# declaration from it.
#
# The namespace is absent on purpose. The host derives it from the repository
# address the operator installed, so no module can name another module's
# address. For this module that is com.github.aux.ccmpbll.tasmota-plugs.

name: smart-plugs
# The kind the one instance is declared under. It offers the service runtime,
# which is what a module with a process needs.
kind: sink
version: 0.1.2
# The licence this module is released under. The marketplace shows it and
# refuses a release without one. An SPDX identifier is the usual form.
license: MIT
# What a marketplace card prints beside the name: the title a person reads,
# one sentence about this module, and who answers for it. The install copies
# them into the declaration, so `GET /api/v1/resources` carries them for an
# installed module. Write your own sentence here, a title if the name alone reads badly, and your name or
# your team's beside it.
# title: Your module's name
title: Tasmota Plugs
summary: Switches Tasmota smart plugs, one or more per printer, from a Tasmota Plugs page, and follows print events.
codeowner: ccmpbll
# The module wire major the process half speaks.
contract_major: 1
# Where the fragment describing the routes is, inside this repository.
openapi: openapi.json
# The platforms the release ships a binary for, each a GOOS_GOARCH pair. Drop
# the ones you do not build, and add the ones you do.
platforms:
  - linux_amd64
  - linux_arm64
  - darwin_arm64
  - windows_amd64

# Every setting this module reads, each with its type, its default and one
# sentence saying what it controls. The host applies every default, writes the
# `config:` block of the instance over it key by key, and sends the result on
# plugin.configure before the first request arrives. A key not named here is
# refused before the process starts, and nothing in main.go reads an
# environment variable, so this list is where an operator finds every knob.
#
# An operator who wants another line writes:
#
#   resources:
#     sink:
#       smart-plugs:
#         config:
#           plug1_name: Core One
#           plug1_host: 192.168.1.30
#           plug1_printer: CZPX1234X009XC12345
options:
  - key: plug1_name
    type: string
    default: ""
    summary: "Plug 1: the name shown for it, such as Core One. Up to 40 characters, without / ? # or %. Empty names it plug1."
  - key: plug1_host
    type: string
    default: ""
    summary: "Plug 1: the Tasmota plug's host name or IPv4 address, with no port. Empty leaves the slot unused."
  - key: plug1_printer
    type: string
    default: ""
    summary: "Plug 1: the serial of the printer it powers, as the printer's page shows it. Empty links no printer."
  - key: plug2_name
    type: string
    default: ""
    summary: "Plug 2: the name shown for it, such as Core One. Up to 40 characters, without / ? # or %. Empty names it plug2."
  - key: plug2_host
    type: string
    default: ""
    summary: "Plug 2: the Tasmota plug's host name or IPv4 address, with no port. Empty leaves the slot unused."
  - key: plug2_printer
    type: string
    default: ""
    summary: "Plug 2: the serial of the printer it powers, as the printer's page shows it. Empty links no printer."
  - key: plug3_name
    type: string
    default: ""
    summary: "Plug 3: the name shown for it, such as Core One. Up to 40 characters, without / ? # or %. Empty names it plug3."
  - key: plug3_host
    type: string
    default: ""
    summary: "Plug 3: the Tasmota plug's host name or IPv4 address, with no port. Empty leaves the slot unused."
  - key: plug3_printer
    type: string
