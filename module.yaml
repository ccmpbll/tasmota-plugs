    default: ""
    summary: "Plug 5: the name shown for it, such as Core One. Up to 40 characters, without / ? # or %. Empty names it plug5."
  - key: plug5_host
    type: string
    default: ""
    summary: "Plug 5: the Tasmota plug's host name or IPv4 address, with no port. Empty leaves the slot unused."
  - key: plug5_printer
    type: string
    default: ""
    summary: "Plug 5: the serial of the printer it powers, as the printer's page shows it. Empty links no printer."
  - key: plug6_name
    type: string
